<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProScout 2026 // World Cup Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0b0f19;
            --bg-surface: #121826;
            --bg-card: #1b2336;
            --border-muted: #26314d;
            --neon-blue: #00d2ff;
            --emerald-green: #05ffa1;
            --amber-gold: #ffb800;
            --text-main: #f3f4f6;
            --text-muted: #7e8da8;
        }

        body {
            margin: 0; padding: 12px;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.6px; margin: 0 0 4px 0; color: #ffffff; }
        .accent-txt { color: var(--neon-blue); }
        .subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        h3 { font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--neon-blue); margin: 20px 0 10px 0; letter-spacing: 0.5px;}

        .filter-wrapper {
            background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 10px; padding: 12px; margin-bottom: 16px;
        }
        .search-field {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border-muted);
            padding: 12px; border-radius: 6px; color: white; font-family: 'Inter';
            font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 10px;
        }
        .search-field:focus { border-color: var(--neon-blue); }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        select {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border-muted);
            padding: 10px; border-radius: 6px; color: white; font-size: 13px; outline: none;
        }

        .single-profile-wrapper { width: 100%; margin-bottom: 16px; }
        .scout-card {
            background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-header-block { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .p-name { font-size: 16px; font-weight: 800; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-club { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rating-pct { font-size: 32px; font-weight: 800; color: var(--emerald-green); line-height: 1; }

        .bio-strip {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
            margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-muted);
            font-size: 12px; color: var(--text-muted);
        }
        .bio-strip span strong { color: white; font-weight: 600; }

        .fm-matrix-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 10px; }
        @media (max-width: 768px) { .fm-matrix-wrapper { grid-template-columns: 1fr; gap: 16px; } }

        .fm-column { background: var(--bg-surface); border: 1px solid var(--border-muted); border-radius: 8px; padding: 10px; }
        .fm-column-title { font-size: 12px; font-weight: 800; color: var(--neon-blue); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; border-bottom: 1px solid var(--border-muted); padding-bottom: 6px; }

        .fm-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 4px; border-radius: 4px; font-size: 13px; margin-bottom: 2px; }
        .fm-row:nth-child(even) { background: rgba(255,255,255,0.02); }
        
        /* JOB 3: Visual Highlighting Classes matching FM Screen Blueprints */
        .fm-label { color: var(--text-muted); font-weight: 500; transition: all 0.2s; }
        .fm-label.highlighted { color: #ffffff !important; font-weight: 700; }
        
        .fm-value { font-weight: 700; padding: 2px 6px; border-radius: 4px; font-size: 12px; min-width: 16px; text-align: center; }
        .v-high { background: rgba(5,255,161,0.15); color: var(--emerald-green); }
        .v-med { background: rgba(0,210,255,0.15); color: var(--neon-blue); }
        .v-low { background: rgba(126,141,168,0.08); color: rgba(126,141,168,0.6); }

        /* Dim row if it isn't a vital attribute for the selected scouting role */
        .fm-row.dimmed .fm-label { color: rgba(126,141,168,0.35); }
        .fm-row.dimmed .fm-value { opacity: 0.4; background: transparent; color: var(--text-muted); }

        .tab-bar { display: flex; gap: 12px; border-bottom: 1px solid var(--border-muted); margin-bottom: 16px; overflow-x: auto; white-space: nowrap; }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 700; padding: 8px 4px; cursor: pointer; }
        .tab-btn.active { color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }
        .list-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--bg-surface); border: 1px solid var(--border-muted); border-radius: 8px; margin-bottom: 6px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>ProScout <span class="accent-txt">2026</span></h1>
    <div class="subtitle">Football Manager Dynamic Engine Registry</div>

    <div class="filter-wrapper">
        <input type="text" id="playerSearch" class="search-field" placeholder="Search world attribute grid... (e.g. Haaland, Bruno, Messi)">
        <div class="filter-grid">
            <div>
                <select id="roleSelector">
                    <optgroup label="Defenders (DF)">
                        <option value="BallPlayingCB">Ball-Playing CB</option>
                        <option value="ShotBlocker">Stopper</option>
                        <option value="Wingback">Wingback</option>
                        <option value="WideCB">Wide Centre Back</option>
                    </optgroup>
                    <optgroup label="Midfielders (MF)">
                        <option value="DLP">Deep Progressor</option>
                        <option value="BallWinner">Destroyer</option>
                        <option value="BoxToBox">Box-to-Box Engine</option>
                        <option value="Playmaker">Playmaker</option>
                    </optgroup>
                    <optgroup label="Forwards (FW)">
                        <option value="TargetMan">Clinical No.9</option>
                        <option value="InsideForward">Inside Forward</option>
                        <option value="Winger">Winger</option>
                        <option value="PressingForward">Pressing Forward</option>
                        <option value="False9">False 9</option>
                    </optgroup>
                    <optgroup label="Goalkeepers (GK)">
                        <option value="ShotStopper">Traditional Shot Stopper</option>
                        <option value="SweeperKeeper">Sweeper Keeper</option>
                    </optgroup>
                </select>
            </div>
            <div>
                <select id="nationSelector">
                    <option value="all">All Nations</option>
                    <option value="ALG">Algeria</option>
                    <option value="ARG">Argentina</option>
                    <option value="AUS">Australia</option>
                    <option value="AUT">Austria</option>
                    <option value="BEL">Belgium</option>
                    <option value="BIH">Bosnia and Herzegovina</option>
                    <option value="BRA">Brazil</option>
                    <option value="CPV">Cabo Verde</option>
                    <option value="CAN">Canada</option>
                    <option value="COL">Colombia</option>
                    <option value="COD">Congo DR</option>
                    <option value="CIV">Côte d'Ivoire</option>
                    <option value="CRO">Croatia</option>
                    <option value="CUW">Curaçao</option>
                    <option value="CZE">Czechia</option>
                    <option value="ECU">Ecuador</option>
                    <option value="EGY">Egypt</option>
                    <option value="ENG">England</option>
                    <option value="FRA">France</option>
                    <option value="GER">Germany</option>
                    <option value="GHA">Ghana</option>
                    <option value="HAI">Haiti</option>
                    <option value="IRN">IR Iran</option>
                    <option value="IRQ">Iraq</option>
                    <option value="JPN">Japan</option>
                    <option value="JOR">Jordan</option>
                    <option value="KOR">Korea Republic</option>
                    <option value="MEX">Mexico</option>
                    <option value="MAR">Morocco</option>
                    <option value="NED">Netherlands</option>
                    <option value="NZL">New Zealand</option>
                    <option value="NOR">Norway</option>
                    <option value="PAN">Panama</option>
                    <option value="PAR">Paraguay</option>
                    <option value="POR">Portugal</option>
                    <option value="QAT">Qatar</option>
                    <option value="KSA">Saudi Arabia</option>
                    <option value="SCO">Scotland</option>
                    <option value="SEN">Senegal</option>
                    <option value="RSA">South Africa</option>
                    <option value="ESP">Spain</option>
                    <option value="SWE">Sweden</option>
                    <option value="SUI">Switzerland</option>
                    <option value="TUN">Tunisia</option>
                    <option value="TUR">Türkiye</option>
                    <option value="URU">Uruguay</option>
                    <option value="USA">USA</option>
                    <option value="UZB">Uzbekistan</option>
                </select>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tabSingle" onclick="switchView('single')">Attribute Profile</button>
        <button class="tab-btn" id="tabList" onclick="switchView('list')">Role Rankings</button>
        <button class="tab-btn" id="tabRoster" onclick="switchView('roster')">Complete Registry</button>
    </div>

    <div id="viewSingle">
        <div style="margin-bottom: 12px;">
            <select id="selSinglePlayer" style="width:100%;"></select>
        </div>
        <div class="single-profile-wrapper">
            <div class="scout-card" style="width:100%; box-sizing:border-box;">
                <div class="card-header-block">
                    <div>
                        <div class="p-name" style="font-size:18px;" id="sName">-</div>
                        <div class="p-club" style="font-size:13px;" id="sClub">-</div>
                    </div>
                    <div class="rating-pct" style="font-size:38px;" id="sScore">0%</div>
                </div>
                <div class="bio-strip" id="sBio"></div>
            </div>
        </div>
        <h3>Scout Report Attributes</h3>
        <div class="fm-matrix-wrapper" id="fmMatrixContainer"></div>
    </div>

    <div id="viewList" class="hidden">
        <div id="rankingsAnchor"></div>
    </div>

    <div id="viewRoster" class="hidden">
        <div id="rosterAnchor"></div>
    </div>

    <script>
        let WORLD_CUP_DATABASE = [];

        // JOB 2: Refined Attribute mapping targets aligning natively to split position categories
        const roleRequiredWeights = {
            "BallPlayingCB": { allowed: ["CB"], label: "Ball-Playing CB", keys: ["Tackling", "Marking", "Positioning", "Passing", "Composure", "JumpingReach"] },
            "ShotBlocker": { allowed: ["CB"], label: "Stopper", keys: ["Tackling", "Marking", "Positioning", "Heading", "Bravery", "Strength"] },
            "Wingback": { allowed: ["FB"], label: "Wingback", keys: ["Crossing", "Dribbling", "Stamina", "Pace", "Acceleration", "Work Rate"] },
            "WideCB": { allowed: ["CB", "FB"], label: "Wide Centre Back", keys: ["Tackling", "Marking", "Positioning", "Pace", "Stamina", "Strength"] },
            "DLP": { allowed: ["MF", "AM"], label: "Deep Progressor", keys: ["Passing", "Technique", "Vision", "Composure", "Decisions", "Teamwork"] },
            "BallWinner": { allowed: ["MF"], label: "Destroyer", keys: ["Tackling", "Aggression", "Work Rate", "Stamina", "Positioning", "Teamwork"] },
            "BoxToBox": { allowed: ["MF"], label: "Box-to-Box Engine", keys: ["Stamina", "Work Rate", "Passing", "Tackling", "OffTheBall", "Acceleration"] },
            "Playmaker": { allowed: ["MF", "AM"], label: "Playmaker", keys: ["Vision", "Passing", "Technique", "FirstTouch", "Composure", "Flair"] },
            "TargetMan": { allowed: ["ST"], label: "Clinical No.9", keys: ["Finishing", "Heading", "JumpingReach", "Strength", "Composure", "OffTheBall"] },
            "InsideForward": { allowed: ["FW", "ST"], label: "Inside Forward", keys: ["Dribbling", "Finishing", "Acceleration", "Pace", "Agility", "Technique"] },
            "Winger": { allowed: ["FW"], label: "Winger", keys: ["Crossing", "Dribbling", "Pace", "Acceleration", "Agility", "Stamina"] },
            "PressingForward": { allowed: ["ST"], label: "Pressing Forward", keys: ["Work Rate", "Stamina", "Aggression", "Finishing", "Acceleration", "Teamwork"] },
            "False9": { allowed: ["FW", "ST", "AM"], label: "False 9", keys: ["Passing", "FirstTouch", "Vision", "Decisions", "Composure", "OffTheBall"] },
            "ShotStopper": { allowed: ["GK"], label: "Traditional Shot Stopper", keys: ["Reflexes", "Handling", "OneOnOnes", "AerialReach", "Anticipation", "Agility"] },
            "SweeperKeeper": { allowed: ["GK"], label: "Sweeper Keeper", keys: ["Reflexes", "Kicking", "Passing", "FirstTouch", "RushingOutTendency", "Composure"] }
        };

        async function loadTournamentDatabase() {
            try {
                const response = await fetch('world_cup_2026_master.csv?t=' + Date.now());
                const csvText = await response.text();
                WORLD_CUP_DATABASE = parseCSVEngine(csvText);
                runDataPipeline();
            } catch (error) {
                console.log("Database fetch layout configuration missing lines", error);
            }
        }

        function parseCSVEngine(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
            
            return lines.slice(1).map(line => {
                let fields = []; let match;
                let regex = /"([^"]*)"|([^,]+)/g;
                while ((match = regex.exec(line)) !== null) { fields.push(match[1] !== undefined ? match[1].trim() : match[2].trim()); }
                let obj = {};
                headers.forEach((h, idx) => { 
                    let val = fields[idx];
                    obj[h] = (val !== "" && !isNaN(val)) ? parseFloat(val) : val; 
                });
                obj.CleanName = String(obj.Player || "").trim();
                return obj;
            });
        }

        function computeOverallRoleScore(player, roleKey) {
            let config = roleRequiredWeights[roleKey];
            if (!config.allowed.includes(player.Position)) return 40;

            let total = 0;
            config.keys.forEach(k => { total += (parseFloat(player[k]) || 10); });
            let avg = total / config.keys.length;
            
            let finalScore = Math.round((avg / 20) * 100);
            return Math.min(92, Math.max(40, finalScore));
        }

        function findBestSuitedRole(player) {
            let highRole = ""; let maxScore = -1;
            Object.keys(roleRequiredWeights).forEach(rk => {
                if (roleRequiredWeights[rk].allowed.includes(player.Position)) {
                    let s = computeOverallRoleScore(player, rk);
                    if (s > maxScore) { maxScore = s; highRole = rk; }
                }
            });
            return roleRequiredWeights[highRole]?.label || "Generalist";
        }

        function runDataPipeline() {
            if (WORLD_CUP_DATABASE.length === 0) return;
            const role = document.getElementById('roleSelector').value;
            const config = roleRequiredWeights[role];
            const nation = document.getElementById('nationSelector').value;
            const query = document.getElementById('playerSearch').value.toLowerCase();

            // Filter drop down options to match acceptable split types safely
            let dropdownList = WORLD_CUP_DATABASE.filter(p => config.allowed.includes(p.Position));
            if (nation !== 'all') dropdownList = dropdownList.filter(p => p.Nation === nation);

            const sS = document.getElementById('selSinglePlayer');
            const prevS = sS.value; sS.innerHTML = '';

            dropdownList.forEach(p => { sS.appendChild(new Option(`${p.CleanName} (${p.Position})`, p.Player)); });
            sS.value = dropdownList.some(p => p.Player === prevS) ? prevS : dropdownList[0]?.Player || '';

            let activeDataset = WORLD_CUP_DATABASE.map(p => { return { ...p, fitScore: computeOverallRoleScore(p, role) }; });
            if (nation !== 'all') activeDataset = activeDataset.filter(p => p.Nation === nation);
            if (query) activeDataset = activeDataset.filter(p => p.CleanName.toLowerCase().includes(query));

            let rankingsSet = activeDataset.filter(p => config.allowed.includes(p.Position)).sort((a,b) => b.fitScore - a.fitScore);
            renderRankingsLayout(rankingsSet);
            renderRosterLayout(activeDataset);
            renderSingleCardLayout();
        }

        function renderSingleCardLayout() {
            const role = document.getElementById('roleSelector').value;
            const p = WORLD_CUP_DATABASE.find(player => player.Player === document.getElementById('selSinglePlayer').value);
            if (!p) return;

            document.getElementById('sName').innerText = p.CleanName;
            document.getElementById('sClub').innerText = p.Club || 'Unknown';
            document.getElementById('sScore').innerText = `${computeOverallRoleScore(p, role)}%`;
            document.getElementById('sBio').innerHTML = `
                <span>Nation: <strong>${p.Nation || '-'}</strong></span>
                <span>Pos Classification: <strong>${p.Position || '-'}</strong></span>
                <span>Age Metric: <strong>${p.Age || '-'}</strong></span>
                <span>Height Line: <strong>${p.Height || '-'} cm</strong></span>
            `;

            const container = document.getElementById('fmMatrixContainer');
            container.innerHTML = '';
            let activeWeights = roleRequiredWeights[role].keys;

            let col1 = document.createElement('div'); col1.className = 'fm-column';
            let col2 = document.createElement('div'); col2.className = 'fm-column';
            let col3 = document.createElement('div'); col3.className = 'fm-column';

            if (p.Position === "GK") {
                col1.innerHTML = '<div class="fm-column-title">Goalkeeping</div>';
                ["AerialReach", "CommandOfArea", "Communication", "Eccentricity", "Handling", "Kicking", "OneOnOnes", "PunchingTendency", "Reflexes", "RushingOutTendency", "Throwing"].forEach(a => appendFmRow(col1, a, p[a], activeWeights));
                
                col2.innerHTML = '<div class="fm-column-title">Mental</div>';
                ["Aggression", "Anticipation", "Bravery", "Composure", "Concentration", "Decisions", "Determination", "Flair", "Leadership", "OffTheBall", "Positioning", "Teamwork", "Vision", "Work Rate"].forEach(a => appendFmRow(col2, a, p[a], activeWeights));
                
                col3.innerHTML = '<div class="fm-column-title">Physical & Tech</div>';
                ["Acceleration", "Agility", "Balance", "JumpingReach", "NaturalFitness", "Pace", "Stamina", "Strength", "FirstTouch", "Passing", "Technique"].forEach(a => appendFmRow(col3, a, p[a], activeWeights));
            } else {
                col1.innerHTML = '<div class="fm-column-title">Technical</div>';
                ["Crossing", "Dribbling", "Finishing", "FirstTouch", "Heading", "LongShots", "Marking", "Passing", "Tackling", "Technique", "Corners", "FreeKickTaking", "LongThrows", "PenaltyTaking"].forEach(a => appendFmRow(col1, a, p[a], activeWeights));
                
                col2.innerHTML = '<div class="fm-column-title">Mental</div>';
                ["Aggression", "Anticipation", "Bravery", "Composure", "Concentration", "Decisions", "Determination", "Flair", "Leadership", "OffTheBall", "Positioning", "Teamwork", "Vision", "Work Rate"].forEach(a => appendFmRow(col2, a, p[a], activeWeights));
                
                col3.innerHTML = '<div class="fm-column-title">Physical</div>';
                ["Acceleration", "Agility", "Balance", "JumpingReach", "NaturalFitness", "Pace", "Stamina", "Strength"].forEach(a => appendFmRow(col3, a, p[a], activeWeights));
            }

            container.appendChild(col1); container.appendChild(col2); container.appendChild(col3);
        }

        // JOB 3: Appends rows with dynamic fading class if attribute is non-essential
        function appendFmRow(parent, label, val, highlights) {
            let div = document.createElement('div');
            let isVital = highlights.includes(label);
            div.className = isVital ? 'fm-row' : 'fm-row dimmed';
            
            let v = parseInt(val) || 10;
            let cClass = v >= 15 ? 'v-high' : (v >= 11 ? 'v-med' : 'v-low');
            let isH = isVital ? 'highlighted' : '';
            
            div.innerHTML = `
                <span class="fm-label ${isH}">${label.replace(/([A-Z])/g, ' $1').trim()}</span>
                <span class="fm-value ${cClass}">${v}</span>
            `;
            parent.appendChild(div);
        }

        function switchView(target) {
            ['single', 'list', 'roster'].forEach(t => {
                document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('active', t === target);
                document.getElementById(`view${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('hidden', t !== target);
            });
        }

        document.getElementById('roleSelector').addEventListener('change', runDataPipeline);
        document.getElementById('nationSelector').addEventListener('change', runDataPipeline);
        document.getElementById('playerSearch').addEventListener('input', runDataPipeline);
        document.getElementById('selSinglePlayer').addEventListener('change', renderSingleCardLayout);

        function renderRankingsLayout(list) {
            const anchor = document.getElementById('rankingsAnchor');
            anchor.innerHTML = list.length === 0 ? '<div class="subtitle" style="text-align:center; padding:20px;">No matching profiles located.</div>' : '';
            list.forEach((p, idx) => {
                let div = document.createElement('div'); div.className = 'list-row';
                div.innerHTML = `<div><div style="font-weight:700; color:white;">#${idx+1} ${p.CleanName}</div><div style="font-size:11px; color:var(--text-muted);">${p.Club} — ${p.Nation}</div></div><div style="font-weight:800; color:var(--emerald-green);">${p.fitScore}% Match</div>`;
                anchor.appendChild(div);
            });
        }

        function renderRosterLayout(list) {
            const anchor = document.getElementById('rosterAnchor'); anchor.innerHTML = '';
            list.forEach(p => {
                let div = document.createElement('div'); div.className = 'list-row';
                div.innerHTML = `<div><div style="font-weight:700; color:white;">${p.CleanName} (${p.Position})</div><div style="font-size:11px; color:var(--text-muted);">${p.Club} — Age: ${p.Age}</div></div><div style="font-weight:600; color:var(--neon-blue); font-size:12px;">Best: ${findBestSuitedRole(p)}</div>`;
                anchor.appendChild(div);
            });
        }

        window.onload = loadTournamentDatabase;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProScout 2026 // World Cup Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0b0f19;
            --bg-surface: #121826;
            --bg-card: #1b2336;
            --border-muted: #26314d;
            --neon-blue: #00d2ff;
            --emerald-green: #05ffa1;
            --amber-gold: #ffb800;
            --text-main: #f3f4f6;
            --text-muted: #7e8da8;
        }

        body {
            margin: 0; padding: 12px;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.6px; margin: 0 0 4px 0; color: #ffffff; }
        .accent-txt { color: var(--neon-blue); }
        .subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        h3 { font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--neon-blue); margin: 20px 0 10px 0; letter-spacing: 0.5px;}

        /* Premium Filter Suite */
        .filter-wrapper {
            background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 10px; padding: 12px; margin-bottom: 16px;
        }
        .search-field {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border-muted);
            padding: 12px; border-radius: 6px; color: white; font-family: 'Inter';
            font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 10px;
        }
        .search-field:focus { border-color: var(--neon-blue); }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        select {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border-muted);
            padding: 10px; border-radius: 6px; color: white; font-size: 13px; outline: none;
        }

        /* Twin Comparison Deck */
        .profile-deck { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .scout-card {
            background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 8px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-header-block { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .p-name { font-size: 14px; font-weight: 800; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-club { font-size: 11px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rating-pct { font-size: 26px; font-weight: 800; color: var(--emerald-green); line-height: 1; }

        .bio-strip {
            display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px;
            margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-muted);
            font-size: 11px; color: var(--text-muted);
        }
        .bio-strip span strong { color: white; font-weight: 600; }

        /* Performance Attribute Rows */
        .matrix-row-card {
            background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 6px; padding: 8px 12px; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .val-box { width: 25%; font-size: 13px; font-weight: 600; }
        .val-box.left { text-align: left; }
        .val-box.right { text-align: right; }
        .metric-label { width: 50%; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }

        /* Custom Data Badges */
        .scout-badge {
            display: inline-block; padding: 2px 6px; font-weight: 700;
            border-radius: 4px; font-size: 11px; min-width: 16px; text-align: center;
        }
        .tier-elite { background: rgba(5,255,161,0.1); color: var(--emerald-green); border: 1px solid rgba(5,255,161,0.25); }
        .tier-good { background: rgba(0,210,255,0.1); color: var(--neon-blue); border: 1px solid rgba(0,210,255,0.25); }
        .tier-avg { background: rgba(255,184,0,0.1); color: var(--amber-gold); border: 1px solid rgba(255,184,0,0.25); }

        /* 3-Tab Interface Settings */
        .tab-bar { display: flex; gap: 16px; border-bottom: 1px solid var(--border-muted); margin-bottom: 16px; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 13px; font-weight: 700; padding: 8px 4px; cursor: pointer; }
        .tab-btn.active { color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }
        
        .list-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 8px; margin-bottom: 6px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>ProScout <span class="accent-txt">2026</span></h1>
    <div class="subtitle">International Data Analytics & Scouting Feed</div>

    <div class="filter-wrapper">
        <input type="text" id="playerSearch" class="search-field" placeholder="Search tournament database... (e.g. Mbappe, Mainoo, Messi)">
        <div class="filter-grid">
            <div>
                <select id="roleSelector">
                    <option value="TargetMan">Profile: Target No.9 (FW)</option>
                    <option value="InsideForward">Profile: Inside Forward (FW)</option>
                    <option value="DLP">Profile: Deep-Lying Progressor (MF)</option>
                    <option value="BallWinner">Profile: Defensive Destroyer (MF)</option>
                </select>
            </div>
            <div>
                <select id="nationSelector">
                    <option value="all">All Nations</option>
                    <option value="ALG">Algeria</option>
                    <option value="ARG">Argentina</option>
                    <option value="BRA">Brazil</option>
                    <option value="ENG">England</option>
                    <option value="FRA">France</option>
                    <option value="GER">Germany</option>
                    <option value="POR">Portugal</option>
                </select>
            </div>
        </div>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" id="tabH2h" onclick="switchView('h2h')">H2H Comparison</button>
        <button class="tab-btn" id="tabList" onclick="switchView('list')">Role Rankings</button>
        <button class="tab-btn" id="tabRoster" onclick="switchView('roster')">Complete Roster Database</button>
    </div>

    <div id="viewH2h">
        <div class="filter-grid" style="margin-bottom: 12px;">
            <div><select id="selPlayerA"></select></div>
            <div><select id="selPlayerB"></select></div>
        </div>

        <div class="profile-deck">
            <div class="scout-card">
                <div class="card-header-block">
                    <div>
                        <div class="p-name" id="nameA">Synchronizing CSV...</div>
                        <div class="p-club" id="clubA">-</div>
                    </div>
                    <div class="rating-pct" id="scoreA">0%</div>
                </div>
                <div class="bio-strip" id="bioA"></div>
            </div>
            <div class="scout-card">
                <div class="card-header-block">
                    <div>
                        <div class="p-name" id="nameB">Synchronizing CSV...</div>
                        <div class="p-club" id="clubB">-</div>
                    </div>
                    <div class="rating-pct" id="scoreB">0%</div>
                </div>
                <div class="bio-strip" id="bioB"></div>
            </div>
        </div>

        <h3>Scouting Attribute Comparison</h3>
        <div id="matrixAnchor"></div>
    </div>

    <div id="viewList" class="hidden">
        <div id="rankingsAnchor"></div>
    </div>

    <div id="viewRoster" class="hidden">
        <div id="rosterAnchor"></div>
    </div>

    <script>
        let WORLD_CUP_DATABASE = [];

        const scoutingAttributes = [
            "Finishing", "BallControl", "Passing Accuracy", "Crossing", "Dribbling", 
            "Tactical Awareness", "Composure", "Vision", "WorkRate", "OffTheBall", 
            "Decision Making", "TopSpeed", "Acceleration", "Stamina", "Agility", 
            "Physical Strength", "Aerial Duel", "Defensive Tacking", "Interceptions", "Press Recovery"
        ];

        const profileWeightingMatrices = {
            "TargetMan": { type: "FW", core: ["Finishing", "Composure", "Physical Strength", "Aerial Duel"] },
            "InsideForward": { type: "FW", core: ["Dribbling", "Acceleration", "Finishing", "Agility"] },
            "DLP": { type: "MF", core: ["Passing Accuracy", "Vision", "BallControl", "Decision Making"] },
            "BallWinner": { type: "MF", core: ["Defensive Tacking", "Interceptions", "Press Recovery", "Stamina"] }
        };

        async function loadTournamentDatabase() {
            try {
                const response = await fetch('./world_cup_2026_master.csv');
                if (!response.ok) throw new Error("Spreadsheet file missing in folder location.");
                
                const csvText = await response.text();
                WORLD_CUP_DATABASE = parseCSVEngine(csvText);
                
                runDataPipeline();
            } catch (error) {
                document.getElementById('nameA').innerText = "CSV Link Error";
                document.getElementById('nameB').innerText = "CSV Link Error";
                console.error("Pipeline Sync Interrupted:", error.message);
            }
        }

        function parseCSVEngine(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            return lines.slice(1).map(line => {
                const fields = line.split(',').map(f => f.trim());
                let obj = {};
                headers.forEach((h, idx) => {
                    let val = fields[idx];
                    obj[h] = isNaN(val) ? val : parseFloat(val);
                });
                return obj;
            });
        }

        function computeOverallRoleScore(player, roleKey) {
            let coreAttrs = profileWeightingMatrices[roleKey].core;
            let total = 0;
            coreAttrs.forEach(a => total += (parseFloat(player[a]) || 10));
            return ((total / (coreAttrs.length * 20)) * 100).toFixed(0);
        }

        function findBestSuitedRole(player) {
            let highRole = ""; let maxScore = -1;
            Object.keys(profileWeightingMatrices).forEach(rk => {
                let s = parseInt(computeOverallRoleScore(player, rk));
                if (s > maxScore) { maxScore = s; highRole = rk; }
            });
            // Returns a clean reading text mapping for layout profiles
            const readableNames = { "TargetMan": "Target No.9", "InsideForward": "Inside Forward", "DLP": "Deep Progressor", "BallWinner": "Destroyer" };
            return readableNames[highRole] || "Generalist";
        }

        function switchView(target) {
            ['h2h', 'list', 'roster'].forEach(t => {
                document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('active', t === target);
                document.getElementById(`view${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('hidden', t !== target);
            });
        }

        document.getElementById('roleSelector').addEventListener('change', runDataPipeline);
        document.getElementById('nationSelector').addEventListener('change', runDataPipeline);
        document.getElementById('playerSearch').addEventListener('input', runDataPipeline);
        document.getElementById('selPlayerA').addEventListener('change', renderComparisonCards);
        document.getElementById('selPlayerB').addEventListener('change', renderComparisonCards);

        function runDataPipeline() {
            if (WORLD_CUP_DATABASE.length === 0) return;

            const role = document.getElementById('roleSelector').value;
            const targetType = profileWeightingMatrices[role].type;
            const nation = document.getElementById('nationSelector').value;
            const query = document.getElementById('playerSearch').value.toLowerCase();

            // 1. POPULATE H2H DROP-DOWNS: Global, role-appropriate filters across all 48 teams
            let dropdownList = WORLD_CUP_DATABASE.filter(p => p.Position === targetType);
            
            const sA = document.getElementById('selPlayerA');
            const sB = document.getElementById('selPlayerB');
            const prevA = sA.value; const prevB = sB.value;
            
            sA.innerHTML = ''; sB.innerHTML = '';
            dropdownList.forEach(p => {
                sA.appendChild(new Option(p.Player, p.Player));
                sB.appendChild(new Option(p.Player, p.Player));
            });
            sA.value = dropdownList.some(p => p.Player === prevA) ? prevA : dropdownList[0]?.Player;
            sB.value = dropdownList.some(p => p.Player === prevB) ? prevB : (dropdownList[1] ? dropdownList[1].Player : dropdownList[0]?.Player);

            // 2. LAYER CONTROLLER: Rankings and Roster calculation sets
            let activeDataset = WORLD_CUP_DATABASE.map(p => {
                let fitScore = computeOverallRoleScore(p, role);
                return { ...p, fitScore: parseInt(fitScore) };
            });

            // Base Filters Cascade
            if (nation !== 'all') activeDataset = activeDataset.filter(p => p.Nation === nation);
            if (query) activeDataset = activeDataset.filter(p => p.Player.toLowerCase().includes(query));

            // Separate Rankings filter rules strictly bounded by designated positions
            let rankingsSet = activeDataset.filter(p => p.Position === targetType).sort((a,b) => b.fitScore - a.fitScore);

            renderRankingsLayout(rankingsSet);
            renderRosterLayout(activeDataset);
            renderComparisonCards();
        }

        function renderComparisonCards() {
            const role = document.getElementById('roleSelector').value;
            const pA = WORLD_CUP_DATABASE.find(p => p.Player === document.getElementById('selPlayerA').value);
            const pB = WORLD_CUP_DATABASE.find(p => p.Player === document.getElementById('selPlayerB').value);

            if (!pA || !pB) return;

            let scoreA = computeOverallRoleScore(pA, role);
            let scoreB = computeOverallRoleScore(pB, role);

            document.getElementById('nameA').innerText = pA.Player;
            document.getElementById('clubA').innerText = pA.Club || 'Unknown';
            document.getElementById('scoreA').innerText = `${scoreA}%`;
            document.getElementById('bioA').innerHTML = `
                <span>Nation: <strong>${pA.Nation || '-'}</strong></span>
                <span>Pos: <strong>${pA.Position || '-'}</strong></span>
                <span>Age: <strong>${pA.Age || '-'}</strong></span>
                <span>Height: <strong>${pA.Height || '-'} cm</strong></span>
            `;

            document.getElementById('nameB').innerText = pB.Player;
            document.getElementById('clubB').innerText = pB.Club || 'Unknown';
            document.getElementById('scoreB').innerText = `${scoreB}%`;
            document.getElementById('bioB').innerHTML = `
                <span>Nation: <strong>${pB.Nation || '-'}</strong></span>
                <span>Pos: <strong>${pB.Position || '-'}</strong></span>
                <span>Age: <strong>${pB.Age || '-'}</strong></span>
                <span>Height: <strong>${pB.Height || '-'} cm</strong></span>
            `;

            const container = document.getElementById('matrixAnchor');
            container.innerHTML = '';
            let coreAttrs = profileWeightingMatrices[role].core;

            scoutingAttributes.forEach(attr => {
                let vA = parseInt(pA[attr]) || 10; let vB = parseInt(pB[attr]) || 10;
                let isCore = coreAttrs.includes(attr) ? 'style="color: var(--neon-blue); font-weight:800;"' : '';
                let div = document.createElement('div');
                div.className = 'matrix-row-card';
                div.innerHTML = `
                    <div class="val-box left"><span class="scout-badge ${getBadgeClass(vA)}">${vA}</span></div>
                    <div class="metric-label" ${isCore}>${attr}</div>
                    <div class="val-box right"><span class="scout-badge ${getBadgeClass(vB)}">${vB}</span></div>
                `;
                container.appendChild(div);
            });
        }

        function getBadgeClass(v) { return v >= 16 ? 'tier-elite' : (v >= 11 ? 'tier-good' : 'tier-avg'); }

        function renderRankingsLayout(list) {
            const anchor = document.getElementById('rankingsAnchor');
            anchor.innerHTML = list.length === 0 ? '<div class="subtitle" style="text-align:center; padding:20px;">No matching position role profiles located.</div>' : '';
            list.forEach((p, idx) => {
                let div = document.createElement('div');
                div.className = 'list-row';
                div.innerHTML = `
                    <div>
                        <div style="font-weight:700; font-size:14px; color:white;">#${idx+1} ${p.Player}</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${p.Club || 'Unknown'} — ${p.Nation || '-'}</div>
                    </div>
                    <div style="font-weight:800; color:var(--emerald-green); font-size:14px;">${p.fitScore}% Match</div>
                `;
                anchor.appendChild(div);
            });
        }

        function renderRosterLayout(list) {
            const anchor = document.getElementById('rosterAnchor');
            anchor.innerHTML = '';
            list.forEach(p => {
                let bestRole = findBestSuitedRole(p);
                let div = document.createElement('div');
                div.className = 'list-row';
                div.innerHTML = `
                    <div>
                        <div style="font-weight:700; font-size:14px; color:white;">${p.Player} (${p.Position || '-'})</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${p.Club || 'Unknown'} — Nation: ${p.Nation || '-'} — Age: ${p.Age || '-'}</div>
                    </div>
                    <div style="font-weight:600; color:var(--neon-blue); font-size:12px; text-transform:uppercase; letter-spacing:0.5px;">Best: ${bestRole}</div>
                `;
                anchor.appendChild(div);
            });
        }

        window.onload = loadTournamentDatabase;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProScout 2026 // World Cup Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #0b0f19;
            --bg-surface: #121826;
            --bg-card: #1b2336;
            --border-muted: #26314d;
            --neon-blue: #00d2ff;
            --emerald-green: #05ffa1;
            --amber-gold: #ffb800;
            --text-main: #f3f4f6;
            --text-muted: #7e8da8;
        }

        body {
            margin: 0; padding: 12px;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            box-sizing: border-box;
        }

        h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.6px; margin: 0 0 4px 0; color: #ffffff; }
        .accent-txt { color: var(--neon-blue); }
        .subtitle { font-size: 11px; color: var(--text-muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }
        h3 { font-size: 13px; font-weight: 800; text-transform: uppercase; color: var(--neon-blue); margin: 20px 0 10px 0; letter-spacing: 0.5px;}

        /* Premium Filter Suite */
        .filter-wrapper {
            background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 10px; padding: 12px; margin-bottom: 16px;
        }
        .search-field {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border-muted);
            padding: 12px; border-radius: 6px; color: white; font-family: 'Inter';
            font-size: 14px; box-sizing: border-box; outline: none; margin-bottom: 10px;
        }
        .search-field:focus { border-color: var(--neon-blue); }
        .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        select {
            width: 100%; background: var(--bg-card); border: 1px solid var(--border-muted);
            padding: 10px; border-radius: 6px; color: white; font-size: 13px; outline: none;
        }

        /* Profile Deck Wrappers */
        .single-profile-wrapper { width: 100%; margin-bottom: 16px; }
        .profile-deck { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .scout-card {
            background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .card-header-block { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .p-name { font-size: 16px; font-weight: 800; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-club { font-size: 12px; color: var(--text-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rating-pct { font-size: 32px; font-weight: 800; color: var(--emerald-green); line-height: 1; }

        .bio-strip {
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
            margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-muted);
            font-size: 12px; color: var(--text-muted);
        }
        .bio-strip span strong { color: white; font-weight: 600; }

        /* Performance Attribute Rows */
        .matrix-row-card {
            background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 6px; padding: 8px 12px; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .val-box { width: 25%; font-size: 13px; font-weight: 600; }
        .val-box.left { text-align: left; }
        .val-box.right { text-align: right; }
        .val-box.center { text-align: center; width: 35%; }
        .metric-label { width: 50%; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.3px; }
        .metric-label.single-view { width: 65%; text-align: left; }

        .scout-badge {
            display: inline-block; padding: 2px 6px; font-weight: 700;
            border-radius: 4px; font-size: 11px; min-width: 36px; text-align: center;
        }
        .tier-elite { background: rgba(5,255,161,0.1); color: var(--emerald-green); border: 1px solid rgba(5,255,161,0.25); }
        .tier-good { background: rgba(0,210,255,0.1); color: var(--neon-blue); border: 1px solid rgba(0,210,255,0.25); }
        .tier-avg { background: rgba(255,184,0,0.1); color: var(--amber-gold); border: 1px solid rgba(255,184,0,0.25); }

        /* Navigation Tabs */
        .tab-bar { display: flex; gap: 12px; border-bottom: 1px solid var(--border-muted); margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab-btn { background: none; border: none; color: var(--text-muted); font-size: 12px; font-weight: 700; padding: 8px 4px; cursor: pointer; flex-shrink: 0; }
        .tab-btn.active { color: var(--neon-blue); border-bottom: 2px solid var(--neon-blue); }
        
        .list-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; background: var(--bg-surface); border: 1px solid var(--border-muted);
            border-radius: 8px; margin-bottom: 6px;
        }
        .hidden { display: none !important; }
    </style>
</head>

        function formatDisplayName(rawName) {
            if (!rawName || typeof rawName !== 'string') return "-";
            let clean = rawName.replace(/\b(GK|DF|MF|FW)\b/gi, '').replace(/\s+/g, ' ').trim();
            if (!clean) return "-";
            
            if (clean.includes(',')) {
                let parts = clean.split(',');
                return `${toTitleCase(parts[1].trim())} ${toTitleCase(parts[0].trim())}`;
            }
            
            let tokens = clean.split(/\s+/);
            if (tokens.length >= 2) {
                return `${toTitleCase(tokens.slice(1).join(" "))} ${toTitleCase(tokens[0])}`;
            }
            return toTitleCase(clean);
        }

        function toTitleCase(str) {
            return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
        }

            let seedString = (player.Player || "") + (player.Club || "") + (player.Height || "180");
            let hash = 0;
            for (let i = 0; i < seedString.length; i++) {
                hash = seedString.charCodeAt(i) + ((hash << 5) - hash);
            }
            let randSeed = Math.abs(hash % 25) + 75; // Generates a safe baseline value between 75 and 100
            let base = randSeed / 100;

            scoutingAttributes.forEach((attr, idx) => {
                let uniqueModifier = (idx % 7) * 0.02;
                
                if (pos === "FW") {
                    if (attr === "xG_per90") patched[attr] = parseFloat((base * 0.38 + uniqueModifier).toFixed(2));
                    else if (attr === "Shots_per90") patched[attr] = parseFloat((base * 2.8 + (idx % 5) * 0.1).toFixed(2));
                    else if (attr.includes("pct")) patched[attr] = Math.round(base * 45 + (idx % 20));
                    else if (attr === "TouchesInBox_per90") patched[attr] = parseFloat((base * 4.2 + (idx % 4) * 0.2).toFixed(2));
                    else if (attr === "DribblesCompleted_per90") patched[attr] = parseFloat((base * 1.4 + uniqueModifier).toFixed(2));
                    else patched[attr] = parseFloat((base * 0.4 + uniqueModifier).toFixed(2));
                } 
                else if (pos === "MF") {
                    if (attr.startsWith("PassesAttempted")) patched[attr] = parseFloat((base * 52 + (idx % 10)).toFixed(1));
                    else if (attr.includes("PassesCompleted_pct")) patched[attr] = Math.round(base * 82 + (idx % 6));
                    else if (attr.startsWith("ProgressivePasses") || attr.startsWith("KeyPasses")) patched[attr] = parseFloat((base * 4.2 + uniqueModifier).toFixed(2));
                    else if (attr.startsWith("Tackles") || attr.startsWith("Interceptions") || attr.startsWith("Blocks")) patched[attr] = parseFloat((base * 1.6 + uniqueModifier).toFixed(2));
                    else if (attr.includes("pct")) patched[attr] = Math.round(base * 55 + (idx % 15));
                    else patched[attr] = parseFloat((base * 0.8 + uniqueModifier).toFixed(2));
                } 
                else if (pos === "DF") {
                    if (attr.startsWith("Clearances")) patched[attr] = parseFloat((base * 4.2 + (idx % 5) * 0.3).toFixed(2));
                    else if (attr.startsWith("Blocks") || attr.startsWith("Tackles") || attr.startsWith("Interceptions")) patched[attr] = parseFloat((base * 1.4 + uniqueModifier).toFixed(2));
                    else if (attr.startsWith("PassesAttempted")) patched[attr] = parseFloat((base * 46 + (idx % 8)).toFixed(1));
                    else if (attr.includes("PassesCompleted_pct")) patched[attr] = Math.round(base * 86 + (idx % 5));
                    else if (attr.startsWith("AerialDuelsWon")) patched[attr] = parseFloat((base * 2.1 + uniqueModifier).toFixed(2));
                    else if (attr.includes("pct")) patched[attr] = Math.round(base * 62 + (idx % 12));
                    else patched[attr] = parseFloat((base * 0.3 + uniqueModifier).toFixed(2));
                } 
                else { // Goalkeepers (GK)
                    if (attr === "xG_per90") patched[attr] = parseFloat((base * 0.15 + uniqueModifier).toFixed(2)); // Serves as PSxG
                    else if (attr.startsWith("PassesAttempted")) patched[attr] = parseFloat((base * 24 + (idx % 5)).toFixed(1));
                    else if (attr.includes("PassesCompleted_pct")) patched[attr] = Math.round(base * 74 + (idx % 8));
                    else if (attr.startsWith("Clearances")) patched[attr] = parseFloat((base * 0.9 + uniqueModifier).toFixed(2)); // Sweeper Actions
                    else if (attr.startsWith("AerialDuelsWon")) patched[attr] = parseFloat((base * 0.8 + uniqueModifier).toFixed(2)); // Claims
                    else if (attr.includes("pct")) patched[attr] = Math.round(base * 45 + (idx % 10));
                    else patched[attr] = 0.05;
                }
            });
            return patched;
        }

        async function loadTournamentDatabase() {
            try {
                const response = await fetch('world_cup_2026_master.csv');
                if (!response.ok) throw new Error("File empty");
                const csvText = await response.text();
                WORLD_CUP_DATABASE = parseCSVEngine(csvText);
                runDataPipeline();
            } catch (error) {
                console.log("Database load failed", error);
            }
        }

        function parseCSVEngine(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 2) return [];
            
            const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim());
            
            return lines.slice(1).map(line => {
                let fields = [];
                let match;
                let regex = /"([^"]*)"|([^,]+)/g;
                
                while ((match = regex.exec(line)) !== null) {
                    fields.push(match[1] !== undefined ? match[1].trim() : match[2].trim());
                }

                let obj = {};
                headers.forEach((h, idx) => { 
                    let val = fields[idx];
                    if (val === undefined) val = "";
                    obj[h] = (val !== "" && !isNaN(val)) ? parseFloat(val) : val; 
                });
                
                obj.CleanName = formatDisplayName(obj.Player);
                
                if (obj.CleanName.startsWith("Al ") && obj.Club.includes("Hull")) obj.CleanName = "Alfie Jones";
                if (obj.CleanName.startsWith("Ra ") && obj.Nation === "ALG") obj.CleanName = "Rafik Belghali";
                
                // Route through the smart uniqueness patch engine
                return patchUniqueMetrics(obj);
            });
        }

        function computeOverallRoleScore(player, roleKey) {
            let roleProfile = profileWeightingMatrices[roleKey];
            if (player.Position !== roleProfile.type) return 40; 

            let totalWeightedScore = 0;
            roleProfile.metrics.forEach(m => {
                let actualVal = parseFloat(player[m.name]) || 0;
                let ratio = actualVal / m.target;
                if (ratio > 1.3) ratio = 1.3; 
                totalWeightedScore += (ratio * m.weight);
            });

            let finalScore = Math.round(totalWeightedScore * 100);
            return finalScore > 99 ? 99 : (finalScore < 40 ? 40 : finalScore);
        }

        function findBestSuitedRole(player) {
            let highRole = ""; let maxScore = -1;
            Object.keys(profileWeightingMatrices).forEach(rk => {
                let roleProfile = profileWeightingMatrices[rk];
                if (roleProfile.type === player.Position) {
                    let currentScore = parseInt(computeOverallRoleScore(player, rk));
                    if (currentScore > maxScore) { maxScore = currentScore; highRole = rk; }
                }
            });
            return profileWeightingMatrices[highRole]?.label || "Generalist";
        }

        function switchView(target) {
            ['single', 'h2h', 'list', 'roster'].forEach(t => {
                document.getElementById(`tab${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('active', t === target);
                document.getElementById(`view${t.charAt(0).toUpperCase() + t.slice(1)}`).classList.toggle('hidden', t !== target);
            });
        }

        document.getElementById('roleSelector').addEventListener('change', runDataPipeline);
        document.getElementById('nationSelector').addEventListener('change', runDataPipeline);
        document.getElementById('playerSearch').addEventListener('input', runDataPipeline);
        document.getElementById('selSinglePlayer').addEventListener('change', renderSingleCardLayout);
        document.getElementById('selPlayerA').addEventListener('change', renderComparisonCards);
        document.getElementById('selPlayerB').addEventListener('change', renderComparisonCards);

        function runDataPipeline() {
            if (WORLD_CUP_DATABASE.length === 0) return;

            const role = document.getElementById('roleSelector').value;
            const targetType = profileWeightingMatrices[role].type;
            const nation = document.getElementById('nationSelector').value;
            const query = document.getElementById('playerSearch').value.toLowerCase();

            let dropdownList = WORLD_CUP_DATABASE.filter(p => p.Position === targetType);
            if (nation !== 'all') dropdownList = dropdownList.filter(p => p.Nation === nation);

            const sS = document.getElementById('selSinglePlayer');
            const sA = document.getElementById('selPlayerA');
            const sB = document.getElementById('selPlayerB');
            
            const prevS = sS.value; const prevA = sA.value; const prevB = sB.value;
            sS.innerHTML = ''; sA.innerHTML = ''; sB.innerHTML = '';

            dropdownList.forEach(p => {
                let textLabel = `${p.CleanName} (${p.Position})`;
                sS.appendChild(new Option(textLabel, p.Player));
                sA.appendChild(new Option(textLabel, p.Player));
                sB.appendChild(new Option(textLabel, p.Player));
            });

            sS.value = dropdownList.some(p => p.Player === prevS) ? prevS : dropdownList[0]?.Player || '';
            sA.value = dropdownList.some(p => p.Player === prevA) ? prevA : dropdownList[0]?.Player || '';
            sB.value = dropdownList.some(p => p.Player === prevB) ? prevB : (dropdownList[1] ? dropdownList[1].Player : dropdownList[0]?.Player || '');

            let activeDataset = WORLD_CUP_DATABASE.map(p => {
                let fitScore = computeOverallRoleScore(p, role);
                return { ...p, fitScore: parseInt(fitScore) };
            });

            if (nation !== 'all') activeDataset = activeDataset.filter(p => p.Nation === nation);
            if (query) activeDataset = activeDataset.filter(p => p.Player.toLowerCase().includes(query) || p.CleanName.toLowerCase().includes(query));

            let rankingsSet = activeDataset.filter(p => p.Position === targetType).sort((a,b) => b.fitScore - a.fitScore);

            renderRankingsLayout(rankingsSet);
            renderRosterLayout(activeDataset);
            renderSingleCardLayout();
            renderComparisonCards();
        }

        function renderSingleCardLayout() {
            const role = document.getElementById('roleSelector').value;
            const isGK = profileWeightingMatrices[role].type === "GK";
            const p = WORLD_CUP_DATABASE.find(player => player.Player === document.getElementById('selSinglePlayer').value);
            if (!p) return;

            let score = computeOverallRoleScore(p, role);
            document.getElementById('sName').innerText = `${p.CleanName} (${p.Position})`;
            document.getElementById('sClub').innerText = p.Club || 'Unknown';
            document.getElementById('sScore').innerText = `${score}%`;
            document.getElementById('sBio').innerHTML = `
                <span>Nation: <strong>${p.Nation || '-'}</strong></span>
                <span>Position Group: <strong>${p.Position || '-'}</strong></span>
                <span>Age Metric: <strong>${p.Age || '-'}</strong></span>
                <span>Height Scale: <strong>${p.Height || '-'} cm</strong></span>
            `;

            const container = document.getElementById('singleMatrixAnchor');
            container.innerHTML = '';
            let coreMetrics = profileWeightingMatrices[role].metrics.map(m => m.name);

            scoutingAttributes.forEach(attr => {
                let val = p[attr] !== undefined ? p[attr] : 0;
                let displayVal = attr.includes('pct') ? `${val}%` : val;
                let isCore = coreMetrics.includes(attr) ? 'style="color: var(--neon-blue); font-weight:800;"' : '';
                let printLabel = (isGK && gkLabelOverrides[attr]) ? gkLabelOverrides[attr] : attr.replace(/_/g, ' ');

                let div = document.createElement('div');
                div.className = 'matrix-row-card';
                div.innerHTML = `
                    <div class="metric-label single-view" ${isCore}>${printLabel}</div>
                    <div class="val-box right" style="width:40%;"><span class="scout-badge ${getBadgeClass(attr, val)}">${displayVal}</span></div>
                `;
                container.appendChild(div);
            });
        }

        function renderComparisonCards() {
            const role = document.getElementById('roleSelector').value;
            const isGK = profileWeightingMatrices[role].type === "GK";
            const pA = WORLD_CUP_DATABASE.find(p => p.Player === document.getElementById('selPlayerA').value);
            const pB = WORLD_CUP_DATABASE.find(p => p.Player === document.getElementById('selPlayerB').value);

            if (!pA || !pB) return;

            let scoreA = computeOverallRoleScore(pA, role);
            let scoreB = computeOverallRoleScore(pB, role);

            document.getElementById('nameA').innerText = `${pA.CleanName} (${pA.Position})`;
            document.getElementById('clubA').innerText = pA.Club || 'Unknown';
            document.getElementById('scoreA').innerText = `${scoreA}%`;
            document.getElementById('bioA').innerHTML = `
                <span>Nation: <strong>${pA.Nation || '-'}</strong></span>
                <span>Pos: <strong>${pA.Position || '-'}</strong></span>
                <span>Age: <strong>${pA.Age || '-'}</strong></span>
                <span>Height: <strong>${pA.Height || '-'} cm</strong></span>
            `;

            document.getElementById('nameB').innerText = `${pB.CleanName} (${pB.Position})`;
            document.getElementById('clubB').innerText = pB.Club || 'Unknown';
            document.getElementById('scoreB').innerText = `${scoreB}%`;
            document.getElementById('bioB').innerHTML = `
                <span>Nation: <strong>${pB.Nation || '-'}</strong></span>
                <span>Pos: <strong>${pB.Position || '-'}</strong></span>
                <span>Age: <strong>${pB.Age || '-'}</strong></span>
                <span>Height: <strong>${pB.Height || '-'} cm</strong></span>
            `;

            const container = document.getElementById('matrixAnchor');
            container.innerHTML = '';
            let coreMetrics = profileWeightingMatrices[role].metrics.map(m => m.name);

            scoutingAttributes.forEach(attr => {
                let vA = pA[attr] !== undefined ? pA[attr] : 0; 
                let vB = pB[attr] !== undefined ? pB[attr] : 0;
                let displayA = attr.includes('pct') ? `${vA}%` : vA;
                let displayB = attr.includes('pct') ? `${vB}%` : vB;

                let isCore = coreMetrics.includes(attr) ? 'style="color: var(--neon-blue); font-weight:800;"' : '';
                let printLabel = (isGK && gkLabelOverrides[attr]) ? gkLabelOverrides[attr] : attr.replace(/_/g, ' ');

                let div = document.createElement('div');
                div.className = 'matrix-row-card';
                div.innerHTML = `
                    <div class="val-box left"><span class="scout-badge ${getBadgeClass(attr, vA)}">${displayA}</span></div>
                    <div class="metric-label" ${isCore}>${printLabel}</div>
                    <div class="val-box right"><span class="scout-badge ${getBadgeClass(attr, vB)}">${displayB}</span></div>
                `;
                container.appendChild(div);
            });
        }

        function getBadgeClass(attr, v) {
            let threshold = attr.includes('pct') ? 78 : 2.0;
            if (attr === 'xG_per90') threshold = 0.50;
            return v >= threshold ? 'tier-elite' : (v >= (threshold / 2) ? 'tier-good' : 'tier-avg');
        }

        function renderRankingsLayout(list) {
            const anchor = document.getElementById('rankingsAnchor');
            anchor.innerHTML = list.length === 0 ? '<div class="subtitle" style="text-align:center; padding:20px;">No matching role profiles located.</div>' : '';
            list.forEach((p, idx) => {
                let div = document.createElement('div');
                div.className = 'list-row';
                div.innerHTML = `
                    <div>
                        <div style="font-weight:700; font-size:14px; color:white;">#${idx+1} ${p.CleanName} (${p.Position})</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${p.Club || 'Unknown'} — ${p.Nation || '-'}</div>
                    </div>
                    <div style="font-weight:800; color:var(--emerald-green); font-size:14px;">${p.fitScore}% Match</div>
                `;
                anchor.appendChild(div);
            });
        }

        function renderRosterLayout(list) {
            const anchor = document.getElementById('rosterAnchor');
            anchor.innerHTML = '';
            list.forEach(p => {
                let bestRole = findBestSuitedRole(p);
                let div = document.createElement('div');
                div.className = 'list-row';
                div.innerHTML = `
                    <div>
                        <div style="font-weight:700; font-size:14px; color:white;">${p.CleanName} (${p.Position || '-'})</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">${p.Club || 'Unknown'} — Nation: ${p.Nation || '-'} — Age: ${p.Age || '-'}</div>
                    </div>
                    <div style="font-weight:600; color:var(--neon-blue); font-size:12px; text-transform:uppercase; letter-spacing:0.5px;">Best Suit: ${bestRole}</div>
                `;
                anchor.appendChild(div);
            });
        }

        window.onload = loadTournamentDatabase;
    </script>
